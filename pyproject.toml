[build-system]
requires = ["setuptools>=84.2.1", "setuptools-scm>=10.3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "cfengine"
dynamic = ["version"]
description = "Human-oriented CLI for interacting with CFEngine policy language, projects, and other CFEngine tools"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "cf-remote>=0.9.7",
    "cfbs>=5.8.1",
    "tree-sitter-cfengine>=1.1.12",
    "tree-sitter>=0.26.0",
    "markdown-it-py>=4.2.0",
    "pyyaml>=6.0.3",
    "pydantic>=2.14.3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Distributed Computing",
  "Topic :: System :: Systems Administration",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.scripts]
cfengine = "cfengine_cli.main:main"

[tool.setuptools]
license-files = [] # Workaround bug in setuptools https://github.com/astral-sh/uv/issues/9513

[tool.setuptools.package-data]
cfengine_cli = ["*.json", "docker/test-agent/Dockerfile"] # syntax-description.json, cfengine test's container

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.setuptools_scm]

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "pytest>=9.2.0",
    "coverage",
]
